# 房地產情報 Agent 監控配置檔
monitoring_settings:
  # 核心監控縣市 (未來想加雙北、高雄直接在此增減，Agent會動態讀取)
  target_regions:
    - "新竹市"
    - "新竹縣"
    - "桃園市"
    - "苗栗縣"
    - "台中市"
  
  # 焦點觀察行政區
  hotspots:
    - "頭份市"
    - "竹南鎮"
    - "竹北市"
    - "新竹市"
    - "中壢區"
    - "大園區"

analysis_indicators:
  # 彈性坪數級距定義：未來想改看鳥籠或豪宅，修改此數字與標籤即可，SQL工具會動態組裝
  ping_intervals:
    - { min: 0,  max: 30,  label: "0-30坪(小宅/鳥籠)" }
    - { min: 30, max: 40,  label: "30-40坪(首購)" }
    - { min: 40, max: 50,  label: "40-50坪(換屋)" }
    - { min: 50, max: 60,  label: "50-60坪(中大坪數)" }
    - { min: 60, max: 70,  label: "60-70坪(大坪數)" }
    - { min: 70, max: 100, label: "70-100坪(豪宅線)" }
